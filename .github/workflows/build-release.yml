name: Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - winlator_bionic
  workflow_dispatch:

jobs:
  build-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;29.0.14206865"
          sdkmanager --install "cmake;3.22.1"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libc6 lib32z1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Get version info
        id: version
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate SHA256 checksum
        run: |
          cd app/build/outputs/apk/release/
          sha256sum *.apk > SHA256SUM.txt
          cat SHA256SUM.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          name: Winlator CMOD GTME ${{ steps.version.outputs.TAG_NAME }}
          body: |
            ## Winlator CMOD - Realme GT Master Edition Optimized
            
            **Optimized for:** Realme GT Master Edition (Snapdragon 778G / Adreno 642L)
            
            ### Device-Specific Optimizations:
            - Default resolution: 960x540 (better FPS on mid-range GPU)
            - DXVK 1.10.3 (best compatibility for Adreno 6xx series)
            - Box64 DynaRec (more mature for Cortex-A78)
            - Vulkan 1.1 (safer than 1.3 for Adreno 642L)
            - DXVK State Cache enabled
            - Minimal DXVK HUD (FPS only)
            
            **Commit:** ${{ steps.version.outputs.SHORT_SHA }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUM.txt
          draft: false
          prerelease: false

  build-nightly:
    if: github.ref == 'refs/heads/winlator_bionic'
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;29.0.14206865"
          sdkmanager --install "cmake;3.22.1"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libc6 lib32z1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Get short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-CMOD-nightly-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/debug/app-debug.apk
