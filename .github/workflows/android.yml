name: Android CI

on:
  push:
    branches: [ "cmod_bionic" ]
  pull_request:
    branches: [ "cmod_bionic" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Clean previously referenced folders
      run: |
        rm -rf app/src/main/cpp/sdl2
        rm -rf app/src/main/cpp/OpenXR-SDK

    - name: Clone SDL2 and OpenXR-SDK
      run: |
        mkdir -p app/src/main/cpp
        git clone --recursive https://github.com/libsdl-org/SDL.git app/src/main/cpp/sdl2
        git clone --recursive https://github.com/KhronosGroup/OpenXR-SDK.git app/src/main/cpp/OpenXR-SDK
        
    - name: download missing files
      run: |
       cd ./app/src/main/assets

       wget -O proton-9.0-arm64ec.txz https://github.com/Vivsi1/winlator/releases/download/Proton-and-ImageFS/proton-9.0-arm64ec.txz
       wget -O proton-9.0-x86_64.txz https://github.com/Vivsi1/winlator/releases/download/Proton-and-ImageFS/proton-9.0-x86_64.txz
       wget -O imagefs.txz https://github.com/Vivsi1/winlator/releases/download/Proton-and-ImageFS/imagefs.txz
    
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install dependencies
      run: |
       sudo apt-get update
       sudo apt-get install -y libgl1 libglu1-mesa libc6 lib32z1
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
       name: Winlator APK
       path: app/build/outputs/apk/debug/app-debug.apk
